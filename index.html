  <style>
    :root {
      --navy: #1A2C3A;
      --cream: #F0EAE0;
      --teal: #0D7A6F;
      --slate: #596873;
      --warm-white: #FBFAF7;
      --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--cream);
      color: var(--navy);
      font-family: var(--font);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 24px 32px;
    }

    .content {
      max-width: 600px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 104px;
      height: auto;
      margin: 0 auto 56px;
    }

    .eyebrow {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--teal);
    }

    .rule {
      width: 40px;
      height: 1px;
      margin: 20px auto 28px;
      border: 0;
      background: var(--teal);
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(28px, 4.6vw, 42px);
      font-weight: 350; /* Segoe UI Semilight */
      line-height: 1.2;
      letter-spacing: -0.005em;
    }

    .lead {
      margin: 0 auto 40px;
      max-width: 480px;
      font-size: 18px;
      line-height: 1.6;
      color: var(--slate);
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-decoration: none;
      color: var(--warm-white);
      background: var(--navy);
      border-radius: 2px;
      transition: background-color 0.2s ease;
    }

    .button:hover,
    .button:focus-visible {
      background: var(--teal);
    }

    .button:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 3px;
    }

    .arrow {
      display: inline-block;
      margin-left: 8px;
      transition: transform 0.2s ease;
    }

    .button:hover .arrow { transform: translateX(3px); }

    footer {
      padding: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--slate);
    }

    footer a {
      color: var(--slate);
      text-decoration: none;
    }

    footer a:hover,
    footer a:focus-visible {
      color: var(--navy);
      text-decoration: underline;
    }

    .sep {
      margin: 0 10px;
      opacity: 0.6;
    }

    @media (max-width: 480px) {
      .logo { width: 88px; margin-bottom: 44px; }
      .lead { font-size: 17px; }
      .sep { margin: 0 6px; }
    }
  </style>
</head>
